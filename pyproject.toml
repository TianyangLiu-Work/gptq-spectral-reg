[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gptq-spectral-reg"
version = "0.1.0"
description = "GPTQ spectral regularization experiments"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "transformers>=4.30",
  "datasets>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "tqdm>=4.64",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gptq_spec*"]
